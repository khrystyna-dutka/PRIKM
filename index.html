<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 2 - Docker + Jenkins</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h2 {
            color: #0fc215;
        }

<body>
    <div class="container">
        <h2>Hello from Docker, launched by Jenkins, triggered by GitHub</h2>

        <!-- Jenkins will insert build info here -->

            <p><em>Waiting for build version...</em></p>
        </div>
    </div>
